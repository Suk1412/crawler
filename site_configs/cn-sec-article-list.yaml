domains:
  - cn-sec.com
  
match:
    path_regex: "^/archives/category/"
    priority: 90

entry_type: article_list

book:
  title_selector: "div.breadcrumb span.current"

catalog:
  title_selector: "h2.title"
  page_mode: next_link
  max_pages: 2
  
  page_selector: "select option"
  page_url_attr: "value"
  next_page_selector: "a.next.page-numbers"
  next_page_url_attr: "href"

  chapter_selector: "h2.entry-title a"
  chapter_title: text
  chapter_url_attr: href

content:
  title_selector: "h1.entry-title"
  paragraph_selector: "div.single-content p"
