domains:
  - default.com

match:
  path_regex: "^/archives/\\d+\\.html$"
  priority: 100

entry_type: single_article

book:
  title_selector: "p.name"

catalog:
  title_selector: "h2.title"
  page_selector: "select option"
  page_url_attr: "value"

  chapter_selector: "ul.read li a"
  chapter_title: text
  chapter_url_attr: href

content:
  title_selector: "h1.entry-title"
  paragraph_selector: "div.single-content p"
